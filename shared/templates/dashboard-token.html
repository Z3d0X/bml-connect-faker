<tr>
    <td><code>{{id}}</code></td>
    <td>{{name}}<br><span class="muted">{{email}}</span></td>
    <td>{{brand}} {{padded_card_number}}<br><span class="muted">{{expiry}}<span {{deleted_hidden}}> · deleted</span></span></td>
    <td>
        <form class="inline" method="post" action="/dashboard/tokens/{{id}}/fail-next"><button>{{fail_next_label}}</button></form>
        <form class="inline" method="post" action="/dashboard/tokens/{{id}}/expire"><button>Expire card</button></form>
    </td>
</tr>
