<div class="card">
    <h1>BML Connect Faker</h1>
    <div class="muted">API base <code>{{base_url}}</code> · not affiliated with Bank of Maldives</div>
    <div class="actions"><form class="inline" method="post" action="/dashboard/reset"><button>Delete all data</button></form></div>
</div>
<div class="card">
    <h2>Transactions</h2>
    <table>
        <tr><th>Id</th><th>Amount</th><th>State</th><th>localId</th><th>Card</th><th>Updated</th></tr>
        {{{transactions}}}
    </table>
</div>
<div class="card">
    <h2>Saved cards</h2>
    <table>
        <tr><th>Token</th><th>Customer</th><th>Card</th><th></th></tr>
        {{{tokens}}}
    </table>
</div>
<div class="card">
    <h2>Webhooks sent</h2>
    <table>
        <tr><th>When</th><th>To</th><th>Status</th><th>Body</th><th></th></tr>
        {{{deliveries}}}
    </table>
</div>
